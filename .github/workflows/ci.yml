name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Lint SKILL.md frontmatter (name + description limits)
        # Inline, because the plugin directory refuses script files from this repo.
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys

          errors = []
          dirs = sorted(d for d in pathlib.Path("skills").iterdir() if d.is_dir())
          if not dirs:
              errors.append("no skill directories found under skills/")
          for d in dirs:
              skill_md = d / "SKILL.md"
              if not skill_md.exists():
                  errors.append(f"{d.name}: SKILL.md missing")
                  continue
              m = re.match(r"^---\n(.*?)\n---\n", skill_md.read_text(encoding="utf-8"), re.S)
              if not m:
                  errors.append(f"{d.name}: missing '---' delimited YAML frontmatter at top of file")
                  continue
              fm = {}
              for line in m.group(1).splitlines():
                  if line.strip() and not line.startswith((" ", "\t", "#")):
                      key, _, value = line.partition(":")
                      fm[key.strip()] = value.strip()
              name, desc = fm.get("name", ""), fm.get("description", "")
              if not name:
                  errors.append(f"{d.name}: frontmatter `name` missing")
              else:
                  if len(name) > 64:
                      errors.append(f"{d.name}: name {len(name)} chars > 64")
                  if not re.match(r"^[a-z0-9]+(-[a-z0-9]+)*$", name):
                      errors.append(f"{d.name}: name '{name}' not lowercase-hyphen")
                  if name != d.name:
                      errors.append(f"{d.name}: name '{name}' != directory '{d.name}'")
              if not desc:
                  errors.append(f"{d.name}: frontmatter `description` missing")
              elif len(desc) > 1024:
                  errors.append(f"{d.name}: description {len(desc)} chars > 1024")
          print("\n".join(errors) or f"ok: {len(dirs)} skills")
          sys.exit(1 if errors else 0)
          EOF
      - name: JSON manifests parse
        run: |
          python3 -c "import json;json.load(open('.claude-plugin/plugin.json'));json.load(open('.claude-plugin/marketplace.json'))"

  skills-sh:
    runs-on: ubuntu-latest
    env:
      DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify skills are discoverable and installable
        run: |
          npx -y skills@1.7.4 add . --list | tee /tmp/skills-list.txt
          # The CLI prints each name after a box character and inside colour codes.
          test "$(sed 's/\x1b\[[0-9;]*m//g' /tmp/skills-list.txt | grep -cE '^│ +evidence-[a-z-]+ *$')" -eq 9
